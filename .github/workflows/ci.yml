name: CI

# The whole repo is the site, so only the root-level docs are skipped. `*`
# does not cross `/`, so this never ignores content/ or app/.
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - LICENSE

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Static export: a failed prerender here is a broken page in production.
      - run: npm run build
